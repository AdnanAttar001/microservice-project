services:

  user-service:
    build: ./user-service
    container_name: user-service
    restart: always
    expose:
      - "3001"

  product-service:
    build: ./product-service
    container_name: product-service
    restart: always
    expose:
      - "3002"

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - product-service
    restart: always
