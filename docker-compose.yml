services:

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    restart: always
    ports:
      - "3001:3001"

  product-service:
    build:
      context: ./product-service
    container_name: product-service
    restart: always
    ports:
      - "3002:3002"

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - product-service
